  </defs>
  <style>
    .phrase { visibility: hidden; }
    .first { visibility: visible; }
    @media (prefers-reduced-motion: no-preference) {
      .phrase {
        visibility: hidden;
        animation: phrase-window 21s step-end infinite;
        animation-delay: var(--start);
      }
      .letter {
        opacity: 0;
        animation: type-letter 21s step-end infinite;
        animation-delay: calc(var(--start) + var(--letter) * 44ms);
      }
    }
    @keyframes phrase-window {
      0% { visibility: visible; }
      32.7%, 100% { visibility: hidden; }
    }
    @keyframes type-letter {
      0% { opacity: 1; }
      33.333%, 100% { opacity: 0; }
    }
  </style>
